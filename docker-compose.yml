# MoneyFlow on the server (Dokploy). Dokploy adds the domain and its network to `app`.
# Data lives outside the containers: DATA_DIR on the host (Dokploy: ../files/moneyflow-data).
x-moneyflow: &moneyflow
  build: .
  restart: unless-stopped
  init: true
  volumes:
    - ${DATA_DIR:-./data}:/app/data

services:
  app:
    <<: *moneyflow
    expose: ["8787"]
    environment:
      COINGECKO_DEMO_API_KEY: ${COINGECKO_DEMO_API_KEY:-}
      APP_PASSWORD: ${APP_PASSWORD:-}
      MCP_READ_TOKEN: ${MCP_READ_TOKEN:-}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  bot:
    <<: *moneyflow
    command: ["npm", "run", "bot"]
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_ID: ${TELEGRAM_ALLOWED_CHAT_ID:-}
      COINGECKO_DEMO_API_KEY: ${COINGECKO_DEMO_API_KEY:-}
    depends_on:
      app:
        condition: service_healthy
